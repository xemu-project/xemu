name: Unit tests

on:
  workflow_call:

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-22.04
    steps:
    - name: Download source package
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
      with:
        name: src
    - name: Extract source package
      run: |
        mkdir src
        tar -xf xemu-*.tar.zst -C src --strip-components=2
    - name: Install dependencies
      run: |
        sudo apt-get -qy update
        pushd src
        sudo apt-get -qy build-dep .
        popd
    - name: Configure
      working-directory: src
      run: ./configure --target-list=i386-softmmu --disable-werror
    - name: Run unit tests
      working-directory: src
      run: make -j$(nproc) check-unit
