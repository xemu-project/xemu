name: Update Website

on:
  workflow_call:

jobs:
  update_website:
    runs-on: ubuntu-latest
    steps:
    - name: Trigger website update
      if: ${{ github.repository_owner == 'xemu-project' }}
      uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
      with:
        workflow: build.yml
        repo: xemu-project/xemu-website
        token: ${{ secrets.XEMU_ROBOT_TOKEN }}
        ref: master
